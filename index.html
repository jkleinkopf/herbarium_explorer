<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herbarium Specimen Explorer</title>

<!--
  ────────────────────────────────────────────────────────────────────
  Herbarium Specimen Explorer — single-file app (index.html)

  FILES NEEDED (in the same folder):
    • index.html      ← this file
    • specimens.json  ← generated by generate_specimens_json.py

  specimens.json schema (all fields per record):
      {"sp":"Quercus robur","year":1952,"month":6,
       "lat":51.2345,"lon":-0.1234,"id":"1234567890","herb":"K"}

  Popup images come from GBIF's image cache, resolved on demand
  via api.gbif.org. Clicking an image opens the ORIGINAL media
  file (the identifier on the publishing institution's server)
  in a new tab. Records with no GBIF id or no media simply show
  no image — nothing breaks.

  Mobile layout: two tabs at the bottom (Map / Charts & Filters).
  Desktop layout: sidebar on the left (25%), map on the right (75%).

  IMPORTANT: page must be served over HTTP (GitHub Pages, or
  `python -m http.server`). Opening via file:// blocks fetch().

  Deploy: commit both files, then Settings → Pages → deploy from
  branch `main`, folder `/ (root)`.
  ────────────────────────────────────────────────────────────────────
-->

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blueimp-md5@2.19.0/js/md5.min.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100vh;
    height: 100dvh;
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* ══════════════════════════════════════════════════════════════
     Base (desktop) layout — sidebar left, map right
     ══════════════════════════════════════════════════════════════ */
  #app {
    display: grid;
    grid-template-columns: minmax(300px, 25%) 1fr;
    height: 100vh;
    height: 100dvh;
  }

  #sidebar {
    overflow-y: auto;
    background: #f8f9fa;
    border-right: 1px solid #dee2e6;
    padding: 14px 16px 30px;
  }
  #sidebar h1 { font-size: 1.05rem; margin: 0 0 3px; font-weight: 650; }
  #status { font-size: .78rem; color: #5a6268; margin: 0 0 16px; line-height: 1.4; }

  .panel { margin-bottom: 18px; }
  .panel h2 {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .05em;
    color: #495057; margin: 0 0 7px; font-weight: 650;
  }
  .panel h2 small {
    text-transform: none; letter-spacing: 0; font-weight: 400;
    color: #8a9199; font-size: .85em;
  }

  .species-list label {
    display: flex; align-items: center; gap: 7px;
    padding: 3px 5px; border-radius: 4px; cursor: pointer;
    font-size: .85rem; user-select: none;
  }
  .species-list label:hover { background: #e9ecef; }
  .species-list input { margin: 0; flex: 0 0 auto; cursor: pointer; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .sp-name { font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .chart-box { position: relative; height: 200px; }
  #yearChart { touch-action: pan-y; }

  #map { height: 100%; background: #dfe3e6; }

  button {
    font: inherit; font-size: .8rem; padding: 6px 11px;
    border: 1px solid #ced4da; background: #fff;
    border-radius: 5px; cursor: pointer; color: #212529;
    touch-action: manipulation;
  }
  button:hover { background: #e9ecef; }
  button:active { background: #dee2e6; }

  /* ══════════════════════════════════════════════════════════════
     Popup styling — centred, clickable specimen image
     ══════════════════════════════════════════════════════════════ */
  .leaflet-popup-content {
    margin: 10px 12px;
    line-height: 1.45;
    font-size: .85rem;
  }

  /* flexbox centres the anchor (and therefore the image) */
  .popup-img {
    display: flex;
    justify-content: center;
    margin-top: 6px;
  }

  .popup-img-link {
    display: inline-block;
    cursor: pointer;
    line-height: 0;                 /* remove baseline gap under the img */
    border-radius: 4px;
    transition: opacity .15s;
  }
  .popup-img-link:hover { opacity: 0.9; }

  .popup-specimen {
    max-width: 100%;
    max-height: 180px;
    border-radius: 4px;
    border: 1px solid #dee2e6;
    display: block;
    transition: border-color .15s;
  }
  .popup-img-link:hover .popup-specimen { border-color: #0d6efd; }

  /* spinner used both in the overlay and inside the popup */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(13,110,253,.15);
    border-top-color: #0d6efd;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ══════════════════════════════════════════════════════════════
     Overlay (loading / errors)
     ══════════════════════════════════════════════════════════════ */
  #overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(255,255,255,.94);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay-body { max-width: 540px; font-size: .9rem; line-height: 1.6; text-align: center; }
  #overlay-body h2 { font-size: 1.05rem; margin: 0 0 10px; }
  #overlay-body code {
    background: #eef0f2; padding: 1px 5px; border-radius: 3px;
    font-size: .88em;
  }

  /* ══════════════════════════════════════════════════════════════
     Mobile tab bar (hidden by default)
     ══════════════════════════════════════════════════════════════ */
  #mobile-tabs { display: none; }

  /* ══════════════════════════════════════════════════════════════
     Mobile layout (≤ 860px)
     ══════════════════════════════════════════════════════════════ */
  @media (max-width: 860px) {
    html, body { overflow: hidden; }

    #app {
      display: block;
      position: relative;
      height: calc(100vh  - 56px);
      height: calc(100dvh - 56px);
      overflow: hidden;
    }

    #sidebar, #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #sidebar {
      background: #f8f9fa;
      border-right: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 14px 16px 30px;
      z-index: 2;
      transform: translateY(100%);
      transition: transform .22s ease;
    }
    #sidebar.mobile-active { transform: translateY(0); }

    #map { z-index: 1; }

    #mobile-tabs {
      display: flex;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 56px;
      background: #fff;
      border-top: 1px solid #dee2e6;
      box-shadow: 0 -1px 4px rgba(0,0,0,0.04);
      z-index: 1000;
    }
    #mobile-tabs button {
      flex: 1;
      border: none;
      border-radius: 0;
      background: transparent;
      font-size: .9rem;
      color: #6c757d;
      padding: 8px;
      cursor: pointer;
    }
    #mobile-tabs button.active {
      color: #0d6efd;
      font-weight: 600;
      box-shadow: inset 0 2px 0 #0d6efd;
    }

    #sidebar h1 { font-size: 1.1rem; }
    #status     { font-size: .84rem; }
    .panel h2   { font-size: .8rem; }
    .species-list label { padding: 9px 6px; font-size: .95rem; }
    .species-list input { width: 18px; height: 18px; }
    .dot { width: 12px; height: 12px; }
    #reset { padding: 10px 16px; font-size: .9rem; }

    .chart-box { height: 220px; }

    .leaflet-popup-content { margin: 8px 10px; }
    .popup-specimen { max-height: 140px; }
  }

  @media (max-width: 860px) and (max-height: 500px) {
    #app { height: calc(100vh  - 44px); height: calc(100dvh - 44px); }
    #mobile-tabs { height: 44px; }
    #mobile-tabs button { font-size: .82rem; }
    .chart-box { height: 180px; }
  }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <h1>Herbarium Specimen Explorer</h1>
    <p id="status">Loading…</p>

    <section class="panel">
      <h2>Species</h2>
      <div id="species-list" class="species-list"></div>
    </section>

    <section class="panel">
      <h2>Collections by year <small>drag to filter</small></h2>
      <div class="chart-box"><canvas id="yearChart"></canvas></div>
    </section>

    <section class="panel">
      <h2>Collections by month <small>tap bars to filter</small></h2>
      <div class="chart-box"><canvas id="monthChart"></canvas></div>
    </section>

    <section class="panel">
      <button id="reset" type="button">Reset all filters</button>
    </section>
  </aside>

  <div id="map"></div>
</div>

<nav id="mobile-tabs" aria-label="View switcher">
  <button type="button" data-tab="map" class="active">Map</button>
  <button type="button" data-tab="controls">Charts &amp; Filters</button>
</nav>

<div id="overlay">
  <div id="overlay-body">
    <h2><span class="spinner"></span>Loading specimens…</h2>
    <p style="color:#6c757d;font-size:.82em;margin:10px 0 0">
      First load may take a few seconds on a phone.
    </p>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════════
     Constants & helpers
     ══════════════════════════════════════════════════════════════ */
  const PALETTE = [
    '#1b9e77', '#d95f02', '#7570b3', '#e7298a',
    '#66a61e', '#e6ab02', '#a6761d', '#666666'
  ];
  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun',
                       'Jul','Aug','Sep','Oct','Nov','Dec'];
  const YEAR_SANE_MIN = 1500;
  const YEAR_SANE_MAX = 2100;

  const IS_TOUCH = (window.matchMedia &&
                    window.matchMedia('(pointer: coarse)').matches) ||
                   ('ontouchstart' in window);
  const RADIUS_TIERS   = IS_TOUCH ? [4, 6, 8] : [3, 4.5, 6];
  const SELECTED_EXTRA = 3;

  // Per-session caches so re-opening the same popup is instant.
  const occurrenceCache = new Map();   // gbifID -> occurrence JSON
  const imageCache      = new Map();   // gbifID -> {cacheUrl, originalUrl} | null

  function toNum(v) {
    if (v === null || v === undefined || v === '') return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  /* ══════════════════════════════════════════════════════════════
     DOM references
     ══════════════════════════════════════════════════════════════ */
  const overlayEl     = document.getElementById('overlay');
  const overlayBody   = document.getElementById('overlay-body');
  const statusEl      = document.getElementById('status');
  const speciesListEl = document.getElementById('species-list');
  const sidebarEl     = document.getElementById('sidebar');
  const mobileTabsEl  = document.getElementById('mobile-tabs');

  /* ══════════════════════════════════════════════════════════════
     Application state
     ══════════════════════════════════════════════════════════════ */
  let specimens   = [];
  let markersArr  = [];
  let speciesList = [];
  const SPECIES_COLOR = {};

  let GLOBAL_MIN_YEAR = 1900;
  let GLOBAL_MAX_YEAR = new Date().getFullYear();

  let baseRadius     = RADIUS_TIERS[0];
  let radiusClass    = -1;
  let selectedMarker = null;

  const state = {
    selectedSpecies: new Set(),
    yearRange: [null, null],
    selectedMonths: new Set()
  };

  /* ══════════════════════════════════════════════════════════════
     Map
     ══════════════════════════════════════════════════════════════ */
  const map = L.map('map', {
    preferCanvas: true,
    renderer: L.canvas(),
    worldCopyJump: true
  }).setView([20, 0], 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  let specimenLayer = L.layerGroup().addTo(map);

  function applyRadiusTier() {
    const z = map.getZoom();
    const cls = z <= 3 ? 0 : (z <= 6 ? 1 : 2);
    if (cls === radiusClass) return;
    radiusClass = cls;
    baseRadius = RADIUS_TIERS[cls];

    for (let i = 0; i < markersArr.length; i++) {
      const m = markersArr[i];
      if (m === selectedMarker) continue;
      m.setRadius(baseRadius);
    }
    if (selectedMarker) selectedMarker.setRadius(baseRadius + SELECTED_EXTRA);
  }

  function selectMarker(m) {
    if (selectedMarker && selectedMarker !== m) {
      selectedMarker.setStyle({ stroke: false, fillOpacity: 0.8 });
      selectedMarker.setRadius(baseRadius);
    }
    selectedMarker = m;
    m.setStyle({ stroke: true, color: '#111', weight: 2, fillOpacity: 1 });
    m.setRadius(baseRadius + SELECTED_EXTRA);
    m.bringToFront();
  }

  function clearSelection() {
    if (!selectedMarker) return;
    selectedMarker.setStyle({ stroke: false, fillOpacity: 0.8 });
    selectedMarker.setRadius(baseRadius);
    selectedMarker = null;
  }

  map.on('click', clearSelection);
  map.on('moveend', function () {
    if (!specimens.length) return;
    refreshStatus(updateMap());
  });
  map.on('zoomend', applyRadiusTier);

  /* ══════════════════════════════════════════════════════════════
     Filter predicates
     ══════════════════════════════════════════════════════════════ */
  function passSpecies(r) {
    return state.selectedSpecies.size === 0 || state.selectedSpecies.has(r.sp);
  }
  function passYear(r) {
    const lo = state.yearRange[0], hi = state.yearRange[1];
    if (lo == null && hi == null) return true;
    if (r.year == null) return false;
    if (lo != null && r.year < lo) return false;
    if (hi != null && r.year > hi) return false;
    return true;
  }
  function passMonth(r) {
    if (state.selectedMonths.size === 0) return true;
    if (r.month == null) return false;
    return state.selectedMonths.has(Math.round(r.month));
  }
  function passesAll(r) {
    return passSpecies(r) && passYear(r) && passMonth(r);
  }

  /* ══════════════════════════════════════════════════════════════
     Map rendering
     ══════════════════════════════════════════════════════════════ */
  function updateMap() {
    const bounds = map.getBounds().pad(0.15);
    const visible = [];
    let total = 0;

    for (let i = 0; i < specimens.length; i++) {
      const r = specimens[i];
      if (!passesAll(r)) continue;
      total++;
      if (!bounds.contains([r.lat, r.lon])) continue;
      visible.push(markersArr[i]);
    }

    map.removeLayer(specimenLayer);
    specimenLayer = L.layerGroup(visible).addTo(map);

    if (selectedMarker) {
      if (visible.indexOf(selectedMarker) === -1) clearSelection();
      else selectedMarker.bringToFront();
    }
    return total;
  }

  function refreshStatus(shown) {
    statusEl.textContent =
      'Showing ' + shown.toLocaleString() +
      ' of ' + specimens.length.toLocaleString() + ' specimens';
  }

  /* ══════════════════════════════════════════════════════════════
     Popup HTML
     ══════════════════════════════════════════════════════════════ */
  function popupHtml(r) {
    const yearTxt  = r.year  == null ? '—' : r.year;
    const monthTxt = r.month == null ? '' : ' (' + MONTH_NAMES[Math.round(r.month) - 1] + ')';
    const herbTxt  = r.herb
      ? '<br>Herbarium: <strong>' + escapeHtml(r.herb) + '</strong>'
      : '';
    const linkTxt  = r.id != null
      ? ' · <a href="https://www.gbif.org/occurrence/' +
        encodeURIComponent(r.id) + '" target="_blank" rel="noopener">GBIF</a>'
      : '';

    const imgContainer = r.id != null
      ? '<div class="popup-img" data-gbif-id="' + escapeHtml(r.id) + '"></div>'
      : '';

    return '<strong style="font-style:italic">' + escapeHtml(r.sp) + '</strong>' +
           herbTxt + '<br>' +
           'Collected: ' + yearTxt + monthTxt + linkTxt + '<br>' +
           '<span style="color:#6c757d;font-size:.85em">' +
           r.lat.toFixed(3) + ', ' + r.lon.toFixed(3) + '</span>' +
           imgContainer;
  }

  /* ══════════════════════════════════════════════════════════════
     GBIF image resolution — returns { cacheUrl, originalUrl }
     cacheUrl   = GBIF's image-cache endpoint (used as the <img> src)
     originalUrl = the publishing institution's original file (the <a> href)
     ══════════════════════════════════════════════════════════════ */
  async function resolveImage(gbifId) {
    if (imageCache.has(gbifId)) return imageCache.get(gbifId);

    let data;
    if (occurrenceCache.has(gbifId)) {
      data = occurrenceCache.get(gbifId);
    } else {
      const res = await fetch('https://api.gbif.org/v1/occurrence/' +
                              encodeURIComponent(gbifId));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
      occurrenceCache.set(gbifId, data);
    }

    const media = Array.isArray(data.media) ? data.media : [];
    const still = media.find(m => m.type === 'StillImage' && m.identifier);
    const anyImg = media.find(m => m.identifier &&
                                   /\.(jpe?g|png|gif|webp)(\?|$)/i.test(m.identifier));
    const chosen = still || anyImg;

    let result = null;
    if (chosen && chosen.identifier && typeof md5 === 'function') {
      const hash = md5(chosen.identifier);
      result = {
        cacheUrl:    'https://api.gbif.org/v1/image/cache/occurrence/' +
                     encodeURIComponent(gbifId) + '/media/' + hash,
        originalUrl: chosen.identifier
      };
    }
    imageCache.set(gbifId, result);
    return result;
  }

  function renderImage(holder, res) {
    if (!res) { holder.innerHTML = ''; return; }
    holder.innerHTML =
      '<a class="popup-img-link" href="' + escapeHtml(res.originalUrl) + '" ' +
         'target="_blank" rel="noopener" title="Open original image">' +
        '<img class="popup-specimen" alt="Specimen image" ' +
             'src="' + escapeHtml(res.cacheUrl) + '">' +
      '</a>';
    const img = holder.querySelector('img');
    if (img) {
      img.addEventListener('error', function () {
        holder.innerHTML = '';
      }, { once: true });
    }
  }

  map.on('popupopen', function (e) {
    const popupEl = e.popup.getElement();
    if (!popupEl) return;
    const holder = popupEl.querySelector('.popup-img');
    if (!holder) return;

    const gbifId = holder.getAttribute('data-gbif-id');
    if (!gbifId) return;

    // Already resolved? Render immediately.
    if (imageCache.has(gbifId)) {
      renderImage(holder, imageCache.get(gbifId));
      return;
    }

    holder.innerHTML = '<span style="color:#6c757d;font-size:.78em">' +
                       '<span class="spinner"></span> Loading image…</span>';

    resolveImage(gbifId)
      .then(res => {
        if (!holder.isConnected) return;   // popup closed before fetch finished
        renderImage(holder, res);
      })
      .catch(() => {
        if (holder.isConnected) holder.innerHTML = '';
      });
  });

  /* ══════════════════════════════════════════════════════════════
     Year chart
     ══════════════════════════════════════════════════════════════ */
  let yearChart = null;
  let dragStart = null, dragCurrent = null;

  const rangeHighlightPlugin = {
    id: 'rangeHighlight',
    afterDatasetsDraw: function (chart) {
      const area = chart.chartArea;
      if (!area) return;
      let a = null, b = null;
      if (dragStart !== null && dragCurrent !== null) {
        a = Math.min(dragStart, dragCurrent);
        b = Math.max(dragStart, dragCurrent);
      } else if (state.yearRange[0] != null && state.yearRange[1] != null) {
        a = state.yearRange[0];
        b = state.yearRange[1];
      }
      if (a === null) return;

      const x1 = chart.scales.x.getPixelForValue(a);
      const x2 = chart.scales.x.getPixelForValue(b);
      const ctx = chart.ctx;
      ctx.save();
      ctx.fillStyle = 'rgba(13,110,253,0.12)';
      ctx.fillRect(x1, area.top, Math.max(x2 - x1, 1), area.bottom - area.top);
      ctx.strokeStyle = 'rgba(13,110,253,0.7)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(x1 + 0.5, area.top); ctx.lineTo(x1 + 0.5, area.bottom);
      ctx.moveTo(x2 + 0.5, area.top); ctx.lineTo(x2 + 0.5, area.bottom);
      ctx.stroke();
      ctx.restore();
    }
  };

  function buildYearChart() {
    const ctx = document.getElementById('yearChart').getContext('2d');
    yearChart = new Chart(ctx, {
      type: 'line',
      data: { datasets: [] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        parsing: false,
        normalized: true,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: items => items.length ? 'Year ' + items[0].parsed.x : '',
              label: item => item.dataset.label + ': ' + item.parsed.y + ' cumulative'
            }
          }
        },
        scales: {
          x: {
            type: 'linear',
            min: GLOBAL_MIN_YEAR,
            max: GLOBAL_MAX_YEAR,
            grid: { display: false },
            ticks: { maxTicksLimit: 6, callback: v => Math.round(v) }
          },
          y: {
            beginAtZero: true,
            title: { display: true, text: 'Cumulative specimens', font: { size: 10 } },
            ticks: { maxTicksLimit: 5, font: { size: 10 } }
          }
        }
      },
      plugins: [rangeHighlightPlugin]
    });

    attachYearDrag(yearChart);
  }

  function attachYearDrag(chart) {
    const c = chart.canvas;
    c.style.cursor = 'crosshair';

    c.addEventListener('pointerdown', function (e) {
      const area = chart.chartArea;
      if (!area) return;
      const rect = c.getBoundingClientRect();
      const px = e.clientX - rect.left;
      if (px < area.left || px > area.right) return;

      const val = chart.scales.x.getValueForPixel(px);
      if (val == null || !isFinite(val)) return;

      dragStart = Math.max(GLOBAL_MIN_YEAR, Math.min(GLOBAL_MAX_YEAR, Math.round(val)));
      dragCurrent = dragStart;
      try { c.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      chart.draw();
    });

    c.addEventListener('pointermove', function (e) {
      if (dragStart === null) return;
      const rect = c.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const val = chart.scales.x.getValueForPixel(px);
      if (val == null || !isFinite(val)) return;
      dragCurrent = Math.max(GLOBAL_MIN_YEAR, Math.min(GLOBAL_MAX_YEAR, Math.round(val)));
      chart.draw();
    });

    function endDrag() {
      if (dragStart === null) return;
      const a = Math.min(dragStart, dragCurrent);
      const b = Math.max(dragStart, dragCurrent);
      dragStart = dragCurrent = null;

      if (b - a < 1) state.yearRange = [null, null];
      else state.yearRange = [a, b];
      updateAll();
    }

    c.addEventListener('pointerup', endDrag);
    c.addEventListener('pointercancel', function () {
      dragStart = dragCurrent = null;
      chart.draw();
    });
  }

  function updateYearChart() {
    const data = specimens.filter(function (r) { return passSpecies(r) && passMonth(r); });

    const counts = {};
    for (let i = 0; i < speciesList.length; i++) counts[speciesList[i]] = Object.create(null);

    for (let i = 0; i < data.length; i++) {
      const r = data[i];
      if (r.year == null) continue;
      const bucket = counts[r.sp];
      if (!bucket) continue;
      bucket[r.year] = (bucket[r.year] || 0) + 1;
    }

    const span = GLOBAL_MAX_YEAR - GLOBAL_MIN_YEAR + 1;
    const datasets = [];

    for (let s = 0; s < speciesList.length; s++) {
      const sp = speciesList[s];
      if (state.selectedSpecies.size > 0 && !state.selectedSpecies.has(sp)) continue;

      const pts = new Array(span);
      let cum = 0, k = 0;
      for (let y = GLOBAL_MIN_YEAR; y <= GLOBAL_MAX_YEAR; y++) {
        cum += (counts[sp][y] || 0);
        pts[k++] = { x: y, y: cum };
      }
      datasets.push({
        label: sp,
        data: pts,
        borderColor: SPECIES_COLOR[sp],
        backgroundColor: SPECIES_COLOR[sp],
        borderWidth: 2,
        pointRadius: 0,
        pointHitRadius: 6,
        tension: 0.2
      });
    }

    yearChart.data.datasets = datasets;
    yearChart.update('none');
  }

  /* ══════════════════════════════════════════════════════════════
     Month chart
     ══════════════════════════════════════════════════════════════ */
  let monthChart = null;

  function buildMonthChart() {
    const ctx = document.getElementById('monthChart').getContext('2d');
    monthChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: MONTH_NAMES,
        datasets: [{
          label: 'Specimens',
          data: new Array(12).fill(0),
          backgroundColor: 'rgba(13,110,253,0.30)',
          borderColor: 'rgba(13,110,253,0.45)',
          borderWidth: 1,
          borderRadius: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: item => item.parsed.y + ' specimens' } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 9 } } },
          y: {
            beginAtZero: true,
            title: { display: true, text: 'Specimens', font: { size: 10 } },
            ticks: { maxTicksLimit: 4, font: { size: 10 } }
          }
        },
        onHover: function (evt, els) {
          evt.native.target.style.cursor = els.length ? 'pointer' : 'default';
        },
        onClick: function (evt, els) {
          if (!els.length) return;
          const m = els[0].index + 1;
          if (state.selectedMonths.has(m)) state.selectedMonths.delete(m);
          else state.selectedMonths.add(m);
          updateAll();
        }
      }
    });
  }

  function updateMonthChart() {
    const data = specimens.filter(function (r) { return passSpecies(r) && passYear(r); });

    const counts = new Array(12).fill(0);
    for (let i = 0; i < data.length; i++) {
      const r = data[i];
      if (r.month == null) continue;
      const m = Math.round(r.month);
      if (m >= 1 && m <= 12) counts[m - 1]++;
    }

    const bg = [], bc = [];
    for (let i = 0; i < 12; i++) {
      const on = state.selectedMonths.has(i + 1);
      bg.push(on ? '#0d6efd' : 'rgba(13,110,253,0.30)');
      bc.push(on ? '#0a58ca' : 'rgba(13,110,253,0.45)');
    }

    const ds = monthChart.data.datasets[0];
    ds.data = counts;
    ds.backgroundColor = bg;
    ds.borderColor = bc;
    monthChart.update('none');
  }

  /* ══════════════════════════════════════════════════════════════
     Master update
     ══════════════════════════════════════════════════════════════ */
  function updateAll() {
    const shown = updateMap();
    refreshStatus(shown);
    updateYearChart();
    updateMonthChart();
  }

  /* ══════════════════════════════════════════════════════════════
     Species selector UI
     ══════════════════════════════════════════════════════════════ */
  function buildSpeciesList() {
    speciesListEl.innerHTML = '';
    speciesList.forEach(function (sp) {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = sp;
      cb.addEventListener('change', function () {
        if (cb.checked) state.selectedSpecies.add(sp);
        else state.selectedSpecies.delete(sp);
        updateAll();
      });

      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = SPECIES_COLOR[sp];

      const name = document.createElement('span');
      name.className = 'sp-name';
      name.textContent = sp;
      name.title = sp;

      label.appendChild(cb);
      label.appendChild(dot);
      label.appendChild(name);
      speciesListEl.appendChild(label);
    });
  }

  function resetFilters() {
    state.selectedSpecies.clear();
    state.yearRange = [null, null];
    state.selectedMonths.clear();
    const boxes = speciesListEl.querySelectorAll('input[type="checkbox"]');
    for (let i = 0; i < boxes.length; i++) boxes[i].checked = false;
    clearSelection();
    updateAll();
  }

  /* ══════════════════════════════════════════════════════════════
     Mobile tab switching
     ══════════════════════════════════════════════════════════════ */
  function setupMobileTabs() {
    if (!mobileTabsEl) return;
    const btns = mobileTabsEl.querySelectorAll('button');

    function activate(name) {
      btns.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
      sidebarEl.classList.toggle('mobile-active', name === 'controls');
      if (name === 'map') setTimeout(() => map.invalidateSize(), 60);
    }

    btns.forEach(b => {
      b.addEventListener('click', () => activate(b.dataset.tab));
    });

    activate('map');
  }

  /* ══════════════════════════════════════════════════════════════
     Data loading & initialisation
     ══════════════════════════════════════════════════════════════ */
  function showError(html) {
    overlayEl.classList.remove('hidden');
    overlayBody.innerHTML = html;
  }

  function init(raw) {
    specimens = [];
    for (let i = 0; i < raw.length; i++) {
      const r = raw[i];
      const lat = toNum(r.lat), lon = toNum(r.lon);
      if (lat === null || lon === null) continue;
      if (lat < -90 || lat > 90 || lon < -180 || lon > 180) continue;

      specimens.push({
        sp:    String(r.sp != null ? r.sp : (r.species != null ? r.species : 'Unknown')),
        year:  toNum(r.year),
        month: toNum(r.month),
        lat:   lat,
        lon:   lon,
        id:    r.id != null ? String(r.id) : null,
        herb:  r.herb != null && String(r.herb).trim() ? String(r.herb).trim() : null
      });
    }

    if (specimens.length === 0) {
      showError('<h2>No usable records</h2><p>Every row in <code>specimens.json</code> ' +
                'had missing or invalid coordinates.</p>');
      return;
    }

    speciesList = Array.from(new Set(specimens.map(function (r) { return r.sp; })))
      .sort(function (a, b) { return a.localeCompare(b); });
    speciesList.forEach(function (sp, i) {
      SPECIES_COLOR[sp] = PALETTE[i % PALETTE.length];
    });

    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < specimens.length; i++) {
      const y = specimens[i].year;
      if (y === null || y < YEAR_SANE_MIN || y > YEAR_SANE_MAX) continue;
      if (y < lo) lo = y;
      if (y > hi) hi = y;
    }
    if (isFinite(lo) && isFinite(hi)) {
      GLOBAL_MIN_YEAR = lo;
      GLOBAL_MAX_YEAR = hi;
    }
    if (GLOBAL_MIN_YEAR >= GLOBAL_MAX_YEAR) {
      GLOBAL_MIN_YEAR -= 1;
      GLOBAL_MAX_YEAR += 1;
    }

    markersArr = specimens.map(function (r) {
      const m = L.circleMarker([r.lat, r.lon], {
        radius: RADIUS_TIERS[0],
        stroke: false,
        fillColor: SPECIES_COLOR[r.sp],
        fillOpacity: 0.8,
        bubblingMouseEvents: false
      });
      m._specimenRecord = r;
      m.bindPopup(function () { return popupHtml(r); });
      m.on('click', function () { selectMarker(m); });
      return m;
    });

    buildSpeciesList();
    buildYearChart();
    buildMonthChart();
    document.getElementById('reset').addEventListener('click', resetFilters);
    setupMobileTabs();

    overlayEl.classList.add('hidden');

    updateAll();
    applyRadiusTier();

    if (specimens.length > 1) {
      const b = L.latLngBounds(specimens.map(function (r) { return [r.lat, r.lon]; }));
      map.fitBounds(b, { padding: [20, 20], maxZoom: 8, animate: false });
      map.setZoom(Math.min(map.getZoom() + 1, 18));
    }
  }

  fetch('specimens.json')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
      return res.json();
    })
    .then(function (data) {
      if (!Array.isArray(data)) throw new Error('specimens.json must contain a JSON array');
      setTimeout(function () { init(data); }, 60);
    })
    .catch(function (err) {
      showError(
        '<h2>Could not load <code>specimens.json</code></h2>' +
        '<p><code>' + escapeHtml(err && err.message ? err.message : 'Unknown error') + '</code></p>' +
        '<p>Make sure <code>specimens.json</code> sits in the same folder as ' +
        '<code>index.html</code>, and that the page is served over HTTP — ' +
        'GitHub Pages, or locally with <code>python -m http.server</code>. ' +
        'Browsers block <code>fetch()</code> on <code>file://</code> URLs.</p>'
      );
    });
})();
</script>
